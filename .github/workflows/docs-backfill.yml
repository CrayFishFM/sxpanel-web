name: Docs backfill

# Writes in-depth docs for one product area per run, working down the list in
# .github/docs-sync/coverage.json, and collects the results in one rolling
# pull request. When that PR is merged, the next run starts a new one with the
# remaining areas. Stops by itself once every area is done.
# Agent instructions: .github/docs-sync/backfill-prompt.md and standard.md

on:
  schedule:
    - cron: "23 */6 * * *"
  workflow_dispatch:
    inputs:
      area:
        description: "Area id from coverage.json to write now (default: the next one not done)"
        required: false

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: docs-backfill
  cancel-in-progress: false

env:
  SOURCE_REPO: sxPanel/sxpanel
  SOURCE_BRANCH: main
  BACKFILL_BRANCH: docs/backfill
  COVERAGE: .github/docs-sync/coverage.json
  WORK: .docs-sync-work
  MODEL: ${{ vars.DOCS_SYNC_MODEL || 'claude-sonnet-5-5' }}
  DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
  GH_TOKEN: ${{ github.token }}

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      # Areas already written into the open PR are marked done on its branch,
      # so continuing from there picks up the next one.
      - name: Continue the open backfill PR, if any
        id: pr
        run: |
          number=$(gh pr list --head "$BACKFILL_BRANCH" --state open --json number --jq '.[0].number // empty')
          if [ -n "$number" ]; then
            git fetch --depth=1 origin "$BACKFILL_BRANCH"
            git checkout -B "$BACKFILL_BRANCH" FETCH_HEAD
          fi
          echo "number=$number" >> "$GITHUB_OUTPUT"

      - name: Pick the area
        id: area
        env:
          AREA_INPUT: ${{ inputs.area }}
        run: |
          if [ -n "$AREA_INPUT" ]; then
            area=$(jq -c --arg id "$AREA_INPUT" '.areas[] | select(.id == $id)' "$COVERAGE")
            if [ -z "$area" ]; then
              echo "::error::No area with id \"$AREA_INPUT\" in $COVERAGE"
              exit 1
            fi
          else
            area=$(jq -c 'first(.areas[] | select(.status != "done")) // empty' "$COVERAGE")
          fi
          if [ -z "$area" ]; then
            echo "Every area in $COVERAGE is done."
            echo "run=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          mkdir -p "$WORK"
          echo "$area" | jq . > "$WORK/area.json"
          echo "id=$(echo "$area" | jq -r .id)" >> "$GITHUB_OUTPUT"
          echo "title=$(echo "$area" | jq -r .title)" >> "$GITHUB_OUTPUT"
          echo "run=true" >> "$GITHUB_OUTPUT"
          echo "Writing: $(echo "$area" | jq -r '.id + " (" + .title + ")"')"

      - name: Check Claude credentials
        if: steps.area.outputs.run == 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ] && [ -z "$CLAUDE_CODE_OAUTH_TOKEN" ]; then
            echo "::error::Set the CLAUDE_CODE_OAUTH_TOKEN or ANTHROPIC_API_KEY repository secret."
            exit 1
          fi

      - name: Check out sxpanel main
        id: src
        if: steps.area.outputs.run == 'true'
        run: |
          git clone --quiet --depth=1 --branch "$SOURCE_BRANCH" \
            "https://github.com/$SOURCE_REPO.git" "$WORK/src"
          echo "sha=$(git -C "$WORK/src" rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - uses: pnpm/action-setup@v4
        if: steps.area.outputs.run == 'true'
        with:
          version: 11

      - uses: actions/setup-node@v4
        if: steps.area.outputs.run == 'true'
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        if: steps.area.outputs.run == 'true'
        run: |
          pnpm install --frozen-lockfile
          npm install --global @anthropic-ai/claude-code

      # The agent can read, search and edit files and run the docs check.
      # It has no shell, no network tools and no GitHub token.
      - name: Write the area
        if: steps.area.outputs.run == 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          GH_TOKEN: ""
        run: |
          # Prefer the subscription token when both are set.
          if [ -n "$CLAUDE_CODE_OAUTH_TOKEN" ]; then
            unset ANTHROPIC_API_KEY
          else
            unset CLAUDE_CODE_OAUTH_TOKEN
          fi
          claude --print "$(cat .github/docs-sync/backfill-prompt.md)" \
            --model "$MODEL" \
            --max-turns 250 \
            --allowedTools "Read" "Glob" "Grep" "Edit" "Write" "Bash(node scripts/check-docs.mjs)"

      - name: Keep only docs edits and mark the area done
        id: result
        if: steps.area.outputs.run == 'true'
        env:
          AREA_ID: ${{ steps.area.outputs.id }}
          SOURCE_SHA: ${{ steps.src.outputs.sha }}
        run: |
          git add -A content/docs .github/docs-sync/source-map.md
          git checkout -- .
          git clean -fdq -- content/docs
          if git diff --cached --quiet; then
            echo "::warning::The agent made no docs changes for $AREA_ID."
          else
            git diff --cached --stat
          fi
          node scripts/check-docs.mjs
          jq --arg id "$AREA_ID" --arg sha "$SOURCE_SHA" --arg at "$(date -u +%F)" \
            '(.areas[] | select(.id == $id)) |= (.status = "done" | .writtenAt = $at | .sourceSha = $sha)' \
            "$COVERAGE" > "$COVERAGE.tmp"
          mv "$COVERAGE.tmp" "$COVERAGE"
          git add "$COVERAGE"

      - name: Publish
        if: steps.area.outputs.run == 'true'
        env:
          AREA_ID: ${{ steps.area.outputs.id }}
          AREA_TITLE: ${{ steps.area.outputs.title }}
          SOURCE_SHA: ${{ steps.src.outputs.sha }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit --quiet -m "docs: in-depth $AREA_TITLE"
          gh auth setup-git

          remaining=$(jq '[.areas[] | select(.status != "done")] | length' "$COVERAGE")
          {
            echo "### $AREA_TITLE"
            echo
            echo "Written against [\`$SOURCE_REPO@${SOURCE_SHA:0:7}\`](https://github.com/$SOURCE_REPO/commit/$SOURCE_SHA)."
            echo
            cat "$WORK/summary.md" 2>/dev/null || echo "_The agent did not write a summary; review the diff._"
          } > "$RUNNER_TEMP/section.md"

          if [ -n "$PR_NUMBER" ]; then
            git push origin "HEAD:refs/heads/$BACKFILL_BRANCH"
            {
              gh pr view "$PR_NUMBER" --json body --jq .body | sed "s/^\*\*Areas left after this PR:\*\* .*/**Areas left after this PR:** $remaining/"
              printf '\n---\n\n'
              cat "$RUNNER_TEMP/section.md"
            } > "$RUNNER_TEMP/body.md"
            gh pr edit "$PR_NUMBER" --body-file "$RUNNER_TEMP/body.md"
          else
            git push --force origin "HEAD:refs/heads/$BACKFILL_BRANCH"
            {
              echo "In-depth documentation, one product area per commit. Each run adds the next area from \`.github/docs-sync/coverage.json\` to this PR; merge whenever you like and the next run starts a fresh PR with what is left."
              echo
              echo "**Areas left after this PR:** $remaining"
              echo
              echo "---"
              echo
              cat "$RUNNER_TEMP/section.md"
            } > "$RUNNER_TEMP/body.md"
            gh pr create --base "$DEFAULT_BRANCH" --head "$BACKFILL_BRANCH" \
              --title "docs: in-depth backfill" --body-file "$RUNNER_TEMP/body.md"
          fi

          {
            echo "## Docs backfill: $AREA_TITLE"
            echo
            cat "$WORK/summary.md" 2>/dev/null || echo "No summary written."
          } >> "$GITHUB_STEP_SUMMARY"
